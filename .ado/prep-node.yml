parameters:
  name: nodeVersion
  type: string
  default: 20

steps:
  - task: UseNode@1
    displayName: Install Node ${{ parameters.nodeVersion }}
    inputs:
      version: ${{ parameters.nodeVersion }}

  - bash: |
      cp publish.npmrc .npmrc
    displayName: "Configure .npmrc to use CFS"

  - task: npmAuthenticate@0
    inputs:
      workingFile: '.npmrc'

  - bash: |
      cp publish.yarnrc.yml .yarnrc.yml
    displayName: "Configure .yarnrc.yml to use CFS"
