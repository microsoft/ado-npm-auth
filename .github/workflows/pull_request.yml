name: Merge and PR Validation

on:
  pull_request:
    branches: ["main"]
  merge_group:

permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      # Skip this for merge queues (already validated in PR build) and the bump PR.
      # This is also because there's not a straightforward way to skip the bump PR when it's
      # in the merge queue.
      - name: Check for change files
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '***NO_CI***') }}
        run: yarn checkchange

      - name: Build, test & lint
        run: yarn lage build test lint bundle

      - name: Check if files updated
        run: git diff --exit-code
